
name: Build HasnAI Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare HasnAI
        run: |
          mkdir www
          cp HasnAI-v5.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          echo '{"appId":"com.hasnraza.hasnai","appName":"HasnAI","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: HasnAI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
